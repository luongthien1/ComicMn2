[project]
name = "comicmn2-backend"
version = "0.1.0"
description = "ComicMn2 backend - FastAPI + PostgreSQL + Neo4j story graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.128.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "neo4j>=5.20.0",
    "psycopg[binary]>=3.3.2",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
