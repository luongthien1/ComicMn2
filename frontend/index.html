<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comic Writer</title>
    <script>
      // Đặt theme trước khi React chạy — tránh nháy nền sáng khi đang dùng chế độ tối
      (function () {
        var m = null;
        try { m = localStorage.getItem("comic-theme"); } catch (e) {}
        if (m !== "light" && m !== "dark") {
          m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = m;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
